name: Release

# The only workflow that publishes anything. Triggered by a git tag:
#   v1.2.3        stable  -> image :1.2.3 :1.2 :latest, chart 1.2.3
#   v1.2.3-rc.1   pre-release (any "-suffix") -> image :1.2.3-rc.1 only,
#                 chart 1.2.3-rc.1 (hidden from helm unless --devel)
# Chart version and appVersion are both taken from the tag, so Chart.yaml
# does not need to be edited for a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/headscale-authkeys-portal
  CHART_DIR: chart/headscale-authkeys-portal
  HELM_VERSION: v3.16.4

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]" >&2; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [validate, image]
    runs-on: ubuntu-latest
    concurrency: helm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package chart
        run: |
          mkdir -p .packaged
          helm package "${CHART_DIR}" --destination .packaged \
            --version "${{ needs.validate.outputs.version }}" \
            --app-version "${{ needs.validate.outputs.version }}"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish to the Helm repo index
        run: |
          set -euo pipefail
          cp .packaged/*.tgz gh-pages/
          cd gh-pages
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "${GITHUB_REPOSITORY}")/"
          helm repo index . --merge index.yaml --url "${REPO_URL}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish chart ${{ needs.validate.outputs.version }}" \
            || { echo "nothing to commit"; exit 0; }
          git push

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: .packaged/*.tgz