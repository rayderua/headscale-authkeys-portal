name: Publish Helm chart

# Stable: push to main -> packaged with the exact version from Chart.yaml.
# Dev: push to development -> version <Chart.yaml version>-dev.<run>+<sha> and
# appVersion "development", so the chart uses the :development image.
# Both channels share one index.yaml on the gh-pages branch; pre-release
# versions are hidden from `helm search`/`helm install` unless --devel is used.
on:
  push:
    branches: [main, development]
    paths:
      - "chart/headscale-authkeys-portal/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CHART_DIR: chart/headscale-authkeys-portal
  HELM_VERSION: v3.16.4

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: helm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Compute chart version
        id: version
        run: |
          set -euo pipefail
          BASE=$(awk '/^version:/{print $2}' "${CHART_DIR}/Chart.yaml" | tr -d '"')
          if [ "${GITHUB_REF_NAME}" = "development" ]; then
            echo "version=${BASE}-dev.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "app_version=development" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            echo "app_version=" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint chart
        run: |
          helm lint "${CHART_DIR}" \
            --set config.publicUrl=https://portal.example.com \
            --set config.headscalePublicUrl=https://hs.example.com \
            --set config.headscaleApiUrl=http://headscale:8080 \
            --set config.oidc.issuer=https://auth.example.com/application/o/hs/ \
            --set config.oidc.clientId=x \
            --set config.admin.group=admins \
            --set existingSecret=portal-secrets

      - name: Package chart
        run: |
          mkdir -p .packaged
          ARGS=(--version "${{ steps.version.outputs.version }}" --destination .packaged)
          if [ -n "${{ steps.version.outputs.app_version }}" ]; then
            ARGS+=(--app-version "${{ steps.version.outputs.app_version }}")
          fi
          helm package "${CHART_DIR}" "${ARGS[@]}"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish to the repo index
        run: |
          set -euo pipefail
          cp .packaged/*.tgz gh-pages/
          cd gh-pages
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "${GITHUB_REPOSITORY}")/"
          helm repo index . --merge index.yaml --url "${REPO_URL}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish ${{ steps.version.outputs.channel }} chart ${{ steps.version.outputs.version }}" \
            || { echo "nothing to commit"; exit 0; }
          git push
