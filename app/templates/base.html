<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('title') }}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">{{ t('title') }}</a>
  {% if user %}
  <form method="post" action="/logout" class="who">
    <span>{{ user.name }}{% if user.is_admin %} <span class="badge">{{ t('admin_badge') }}</span>{% endif %}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link" type="submit">{{ t('sign_out') }}</button>
  </form>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
