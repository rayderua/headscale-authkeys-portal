{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal.fullname" . }}
  labels: {{- include "portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secretsEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
