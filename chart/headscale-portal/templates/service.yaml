apiVersion: v1
kind: Service
metadata:
  name: {{ include "portal.fullname" . }}
  labels: {{- include "portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
  selector: {{- include "portal.selectorLabels" . | nindent 4 }}
